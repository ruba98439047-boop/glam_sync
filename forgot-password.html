<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlamSync - Reset Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff0f5, #f8c8dc);
            padding: 20px;
        }

        .reset-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(190, 50, 110, 0.2);
        }

        h1 {
            color: #d63384;
            text-align: center;
            margin-bottom: 12px;
        }

        h2 {
            text-align: center;
            margin-bottom: 12px;
        }

        p {
            color: #777;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2c5d2;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b82068;
        }

        #message {
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #d63384;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="reset-box">

        <h1>💄 GlamSync</h1>
        <h2>Reset Password</h2>

        <p>Enter your registered email and choose a new password.</p>

        <form id="resetForm">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter registered email"
                required>

            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                placeholder="At least 8 characters"
                minlength="8"
                required>

            <button type="submit">Reset Password</button>

            <p id="message" role="status"></p>

        </form>

        <div class="links">
            <a href="login.html">← Back to Login</a>
        </div>

    </div>

    <script>
        document.getElementById("resetForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const newPassword =
                    document.getElementById("newPassword").value;

                const message =
                    document.getElementById("message");

                message.style.color = "#555";
                message.textContent = "Updating password...";

                try {
                    const response = await fetch(
                        "/api/users/reset-password",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                email: email,
                                newPassword: newPassword
                            })
                        }
                    );

                    

                    const data = await response.json();

if (response.ok) {
    message.style.color = "green";
    message.textContent =
        data.message || "Password reset successful!";
} else {
    message.style.color = "red";
    message.textContent =
        data.message || "Error code: " + response.status;
}

                } catch (error) {
                    message.style.color = "red";
                    message.textContent =
                        "Unable to connect to the server.";
                }
            }
        );
    </script>

</body>
</html>
