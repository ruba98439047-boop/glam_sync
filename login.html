<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlamSync - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff0f5, #f8c8dc);
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(190, 50, 110, 0.2);
        }

        h1 {
            color: #d63384;
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2c5d2;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b82068;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
        }

        a {
            color: #d63384;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>💄 GlamSync</h1>
        <h2>Welcome Back!</h2>

        <p class="subtitle">Login to your beauty world ✨</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>

            <button type="submit">Login</button>

<div style="text-align:center; margin-top:15px;">
    <a href="forgot-password.html">Forgot Password?</a>
</div>

<p id="message" role="status"></p>
        </form>

        <div class="links">
            Don't have an account?
            <a href="register.html">Register</a>
            <br>
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                message.style.color = "#555";
                message.textContent = "Checking login...";

                try {
                    const response = await fetch("/api/users/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
    message.style.color = "green";
    message.textContent = "Login successful!";

    setTimeout(function() {
        window.location.href = "/dashboard.html";
    }, 1000);

} else {
    message.style.color = "red";
    message.textContent =
        data.message || "Invalid login details.";
}

                } catch (error) {
                    message.style.color = "red";
                    message.textContent =
                        "Unable to connect to the server.";
                }
            }
        );
    </script>

</body>
</html>
