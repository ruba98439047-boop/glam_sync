<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlamSync - Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #fff0f5, #f8c8dc, #fce4ec);
        }

        .register-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(190, 50, 110, 0.18);
        }

        .logo {
            text-align: center;
            color: #d63384;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2c5d2;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d63384;
            box-shadow: 0 0 5px rgba(214, 51, 132, 0.2);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #b82068;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #d63384;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">💄 GlamSync</div>

        <h2>Create Account</h2>

        <p class="subtitle">
            Your beauty journey starts here!
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                    maxlength="100">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    maxlength="150">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                    minlength="8">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                    minlength="8">
            </div>

            <button type="submit">Create Account ✨</button>

            <p id="message" role="status"></p>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

    <script>
        const registerForm = document.getElementById("registerForm");
        const message = document.getElementById("message");

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (!name || !email || !password || !confirmPassword) {
                message.style.color = "red";
                message.textContent = "Please fill in all fields.";
                return;
            }

            if (password.length < 8) {
                message.style.color = "red";
                message.textContent =
                    "Password must contain at least 8 characters.";
                return;
            }

            if (password !== confirmPassword) {
                message.style.color = "red";
                message.textContent = "Passwords do not match.";
                return;
            }

            message.style.color = "#555";
            message.textContent = "Creating your account...";

            try {
                const response = await fetch("/api/users/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    message.style.color = "green";
                    message.textContent =
                        data.message || "Registration successful!";

                    registerForm.reset();
                } else {
                    message.style.color = "red";
                    message.textContent =
                        data.message || "Registration failed.";
                }

            } catch (error) {
                message.style.color = "red";
                message.textContent =
                    "Unable to connect. Check whether the backend is running.";
            }
        });
    </script>

</body>
</html>
